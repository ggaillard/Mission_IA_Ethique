const StatusBar=({playerName,phase,score,elapsedTime})=>(<><div className="progress-bar"><div className="progress-fill" style={{width:`${(phase/7)*100}%`}}></div></div><div className="status-bar"><div style={{display:'flex',alignItems:'center',gap:'8px'}}><span style={{fontSize:'1.2rem'}}>🧠</span><strong>MISSION CONSCIENCE</strong></div><div style={{display:'flex',gap:'20px',color:'var(--text-muted)'}}><span>👤 {playerName}</span><span style={{color:'var(--accent-purple)'}}>Phase {phase}/7</span><span>🎯 {score.correct}/{score.total}</span><span className="timer">⏱️ {formatTime(elapsedTime)}</span></div></div></>);

const StartScreen=({onStart,playerName,setPlayerName,playerEmail,setPlayerEmail})=>{const[isValid,setIsValid]=useState(false);useEffect(()=>{const re=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;setIsValid(playerName.trim().length>0&&re.test(playerEmail))},[playerName,playerEmail]);return(<div className="container" style={{minHeight:'100vh',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',textAlign:'center'}}><div className="fade-in"><div style={{fontSize:'5rem',marginBottom:'20px'}}>🧠</div><h1 style={{background:'linear-gradient(90deg,var(--accent-purple),var(--accent-pink))',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',marginBottom:'12px'}}>MISSION CONSCIENCE</h1><p style={{color:'var(--text-muted)',fontSize:'1.1rem',marginBottom:'8px'}}>Du Code à la Conscience</p><p style={{color:'var(--accent-purple)',fontSize:'.95rem',marginBottom:'40px'}}>Éthique & Responsabilité du Développeur face à l'IA • BTS SIO SLAM</p><div className="card" style={{maxWidth:'420px',textAlign:'left'}}><h3 style={{marginBottom:'16px'}}>🎮 Commencer la mission</h3><input type="text" placeholder="Votre prénom et nom" value={playerName} onChange={e=>setPlayerName(e.target.value)} className="input-field"/><input type="email" placeholder="Votre adresse email" value={playerEmail} onChange={e=>setPlayerEmail(e.target.value)} className="input-field" style={{marginBottom:'8px'}}/><p style={{fontSize:'.8rem',color:'var(--text-muted)',marginBottom:'16px'}}>📧 Votre score sera envoyé à votre professeur.</p><button className="btn btn-primary" onClick={onStart} disabled={!isValid} style={{width:'100%',justifyContent:'center'}}>🚀 Démarrer</button></div><div style={{marginTop:'30px',color:'var(--text-muted)',fontSize:'.9rem'}}><p>⏱️ Durée : 45-50 min • 📚 Documents inclus</p></div></div></div>);};

const AlertScreen=({onNext,playerName})=>{const[showBriefing,setShowBriefing]=useState(false);const[viralCount,setViralCount]=useState(1247);useEffect(()=>{const t=setTimeout(()=>setShowBriefing(true),2500);return()=>clearTimeout(t)},[]);useEffect(()=>{const i=setInterval(()=>{setViralCount(c=>c+Math.floor(Math.random()*50)+10)},1500);return()=>clearInterval(i)},[]);return(<div className="container main"><div style={{textAlign:'center',marginBottom:'24px'}}><p style={{color:'var(--text-muted)'}}>📅 Mardi 4 février 2025 — 08:15</p><h1 style={{color:'var(--accent-pink)'}}>📱 ALERTE VIRALE</h1></div><div className="viral-post glow fade-in" style={{marginBottom:'24px'}}><div className="linkedin-header"><div className="linkedin-avatar">👩‍💼</div><div><strong>Sarah Dupont</strong><div style={{color:'var(--text-muted)',fontSize:'.85rem'}}>Ingénieure DevOps • 10 ans d'expérience</div></div></div><p style={{fontSize:'1.1rem',lineHeight:'1.7'}}>J'ai postulé chez <strong style={{color:'var(--accent-cyan)'}}>TalentFlow</strong> hier. Leur "IA de matching" m'a rejetée en <strong style={{color:'var(--accent-red)'}}>3,2 secondes</strong>.<br/><br/>10 ans d'expérience. 3 certifications AWS. Lead sur des projets à 50M€.<br/><br/>Mais apparemment, l'algorithme sait mieux que moi ce que je vaux. 🤖<br/><br/><strong style={{color:'var(--accent-amber)'}}>#IADiscrimination #RecrutementBiaisé</strong></p><div className="linkedin-stats"><span>👍 <strong style={{color:'var(--accent-pink)'}}>{viralCount.toLocaleString()}</strong></span><span>💬 847 commentaires</span><span>🔄 {Math.floor(viralCount/3)} partages</span></div></div>{showBriefing&&(<div className="fade-in"><Alert type="danger" title="🚨 Message de votre CTO"><p>"{playerName}, urgence absolue. Ce post explose. La CNIL ouvre une enquête. J'ai besoin que tu investigues notre système."</p></Alert><div className="card"><h3 style={{marginBottom:'16px'}}>📋 Situation</h3><ul style={{listStyle:'none',display:'flex',flexDirection:'column',gap:'8px'}}><li>🏢 <strong>TalentFlow</strong> — Startup RH, 85 employés</li><li>🤖 <strong>Produit</strong> — IA de matching candidat/poste</li><li>⚠️ <strong>Accusation</strong> — Discrimination algorithmique</li></ul></div><div className="card" style={{borderColor:'var(--accent-purple)',background:'rgba(168,85,247,.05)'}}><h3 style={{marginBottom:'12px',color:'var(--accent-purple)'}}>🧠 Votre rôle : Développeur·se SLAM</h3><p style={{color:'var(--text-muted)',marginBottom:'12px'}}>Vous n'êtes pas un simple exécutant. Vous êtes un <strong>acteur éthique</strong>.</p><p style={{marginTop:'12px',fontStyle:'italic',color:'var(--accent-purple)'}}>"Le développeur questionne ce qu'il construit."</p></div><div className="card" style={{background:'linear-gradient(135deg,rgba(168,85,247,.1),rgba(255,107,157,.05))'}}><ConceptBadge>Comprendre le contexte</ConceptBadge><p style={{margin:'12px 0',color:'var(--text-muted)'}}>Découvrez le cas Amazon qui a fait trembler la tech en 2018.</p><ResourceLink resourceKey="cas_amazon_rh"/></div><div style={{textAlign:'center',marginTop:'24px'}}><button className="btn btn-primary" onClick={onNext}>🏃 Rejoindre la salle de crise →</button></div></div>)}</div>);};

const InvestigationScreen=({onComplete,onAnswer,setPhaseStats})=>{const[selectedFile,setSelectedFile]=useState(null);const[foundClues,setFoundClues]=useState([]);const[answered,setAnswered]=useState(false);const[selectedAnswer,setSelectedAnswer]=useState(null);const phaseStartTime=useRef(Date.now());const files={training_data:{name:"training_data_stats.json",icon:"📊",content:[{text:"=== STATISTIQUES DONNÉES D'ENTRAÎNEMENT ===",type:"purple"},{text:"Total candidatures: 127,453",type:"muted"},{text:"",type:"muted"},{text:"Répartition par genre:",type:"amber"},{text:"  - Hommes: 78.3%",type:"muted"},{text:"  - Femmes: 21.7%",type:"muted"},{text:"",type:"muted"},{text:"Candidats 'embauchés':",type:"amber"},{text:"  - Hommes: 84.2%",type:"red"},{text:"  - Femmes: 15.8%",type:"red"},{text:"",type:"muted"},{text:"⚠️ ALERTE: Déséquilibre significatif",type:"red"}],analysis:"Les données reflètent les biais historiques : 78% d'hommes. L'IA apprend à reproduire cette discrimination.",concept:"biais_algorithmiques"},model_features:{name:"model_config.py",icon:"🐍",code:`FEATURES = [

 simple exécutant.</p><div className="grid-2" style={{marginBottom:'16px'}}><div style={{padding:'12px',background:'var(--bg-dark)',borderRadius:'8px'}}><strong style={{color:'var(--accent-pink)'}}>🤔 Questionner</strong><p style={{fontSize:'.85rem',color:'var(--text-muted)',marginTop:'4px'}}>Ce que je code est-il éthique ?</p></div><div style={{padding:'12px',background:'var(--bg-dark)',borderRadius:'8px'}}><strong style={{color:'var(--accent-cyan)'}}>🔍 Détecter</strong><p style={{fontSize:'.85rem',color:'var(--text-muted)',marginTop:'4px'}}>Identifier biais et violations</p></div><div style={{padding:'12px',background:'var(--bg-dark)',borderRadius:'8px'}}><strong style={{color:'var(--accent-amber)'}}>📢 Alerter</strong><p style={{fontSize:'.85rem',color:'var(--text-muted)',marginTop:'4px'}}>Escalader, documenter</p></div><div style={{padding:'12px',background:'var(--bg-dark)',borderRadius:'8px'}}><strong style={{color:'var(--accent-green)'}}>🛡️ Protéger</strong><p style={{fontSize:'.85rem',color:'var(--text-muted)',marginTop:'4px'}}>Implémenter des garde-fous</p></div></div><p style={{fontStyle:'italic',textAlign:'center',color:'var(--accent-purple)'}}>"Du code à la conscience — chaque ligne a un impact humain."</p></div><div className="card"><h3 style={{marginBottom:'16px'}}>📚 Fiches ressources</h3><div className="grid-2"><ResourceLink resourceKey="dimensions_ethiques" compact/><ResourceLink resourceKey="ai_act_rgpd" compact/><ResourceLink resourceKey="explicabilite_ia" compact/><ResourceLink resourceKey="charte_ethique" compact/></div></div><ExternalResources/><div className="card" style={{textAlign:'center'}}><h3>🚀 L'éthique de l'IA : enjeu majeur</h3><div className="grid-3" style={{margin:'20px 0'}}><div><div style={{fontSize:'2rem',fontWeight:700}}>85%</div><div style={{color:'var(--text-muted)',fontSize:'.85rem'}}>des IA ont des biais</div></div><div><div style={{fontSize:'2rem',fontWeight:700}}>2024</div><div style={{color:'var(--text-muted)',fontSize:'.85rem'}}>AI Act européen</div></div><div><div style={{fontSize:'2rem',fontWeight:700}}>+200%</div><div style={{color:'var(--text-muted)',fontSize:'.85rem'}}>demande éthiciens IA</div></div></div><p style={{fontStyle:'italic',color:'var(--text-muted)'}}>"L'IA que vous construisez façonne la société de demain."</p></div></div>);};

const App=()=>{const[gameState,setGameState]=useState('start');const[playerName,setPlayerName]=useState('');const[playerEmail,setPlayerEmail]=useState('');const[score,setScore]=useState({correct:0,total:0});const[phase,setPhase]=useState(1);const[elapsedTime,setElapsedTime]=useState(0);const[phaseStats,setPhaseStats]=useState({});const timerRef=useRef(null);useEffect(()=>{if(gameState!=='start'&&gameState!=='final'){timerRef.current=setInterval(()=>{setElapsedTime(t=>t+1)},1000)}return()=>clearInterval(timerRef.current)},[gameState]);const handleAnswer=(correct)=>{setScore(prev=>({correct:prev.correct+(correct?1:0),total:prev.total+1}))};const screens={start:<StartScreen onStart={()=>{setGameState('alert');setPhase(1)}} playerName={playerName} setPlayerName={setPlayerName} playerEmail={playerEmail} setPlayerEmail={setPlayerEmail}/>,alert:<AlertScreen onNext={()=>{setGameState('investigation');setPhase(2)}} playerName={playerName}/>,investigation:<InvestigationScreen onComplete={()=>{setGameState('dimensions');setPhase(3)}} onAnswer={handleAnswer} setPhaseStats={setPhaseStats}/>,dimensions:<DimensionsScreen onComplete={()=>{setGameState('decision');setPhase(4)}} onAnswer={handleAnswer} setPhaseStats={setPhaseStats}/>,decision:<DecisionScreen onDecision={()=>{setGameState('code');setPhase(5)}} setPhaseStats={setPhaseStats}/>,code:<CodeChallengeScreen onComplete={()=>{setGameState('charter');setPhase(6)}} onAnswer={handleAnswer} setPhaseStats={setPhaseStats}/>,charter:<CharterScreen onComplete={()=>{setGameState('final');setPhase(7);clearInterval(timerRef.current)}} onAnswer={handleAnswer} setPhaseStats={setPhaseStats}/>,final:<FinalScreen score={score} playerName={playerName} playerEmail={playerEmail} elapsedTime={elapsedTime} phaseStats={phaseStats}/>};return(<div>{gameState!=='start'&&gameState!=='final'&&<StatusBar playerName={playerName} phase={phase} score={score} elapsedTime={elapsedTime}/>}{screens[gameState]}</div>)};

ReactDOM.render(<App/>,document.getElementById('root'));
    </script>
